<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Expense Tracker v2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>💰 Smart Expense Tracker <small>v2</small></h1><p>Node.js + Express REST API · Budgets · Search · CSV export</p></header>
<main>
  <section class="card">
    <h2 id="formTitle">Add Expense</h2>
    <form id="expenseForm" class="grid">
      <input id="title" placeholder="Title (e.g. Lunch)" maxlength="80" required>
      <input id="amount" type="number" step="0.01" min="0.01" placeholder="Amount (₹)" required>
      <select id="category"></select>
      <input id="spent_on" type="date">
      <button type="submit" id="submitBtn">Add</button>
    </form>
    <p id="msg" class="msg"></p>
  </section>

  <section class="card">
    <div class="row">
      <h2>Monthly Budget Tracker</h2>
      <input type="month" id="month">
    </div>
    <p id="alerts"></p>
    <div id="budgets"></div>
  </section>

  <section class="card">
    <div class="row">
      <h2>Expenses</h2>
      <div class="tools">
        <input id="search" placeholder="Search title…">
        <select id="filter"></select>
        <a href="/api/export.csv" class="btn">⬇ CSV</a>
      </div>
    </div>
    <p class="total">Listed total: <strong id="total">₹0.00</strong></p>
    <table>
      <thead><tr><th>Date</th><th>Title</th><th>Category</th><th>Amount</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
